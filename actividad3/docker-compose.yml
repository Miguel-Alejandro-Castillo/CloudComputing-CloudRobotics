services:
  simupi:
    container_name: simupi
    build:
      context: ./simupi
      dockerfile: Dockerfile
    restart: unless-stopped
    volumes:
      - ./simupi:/app/data
    ports:
      - "5000:5000"
      - "1884:1883"
    environment:
      - PORT=5000
  nodered:
    container_name: nodered-simupi
    build:
      context: ./nodered
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "1888:1880"
    environment:
      - TZ=America/Argentina/Buenos_Aires
    volumes:
      - ./nodered/data:/data
    depends_on:
      - simupi

